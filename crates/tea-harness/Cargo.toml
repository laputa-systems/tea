[package]
name = "tea-harness"
version = "1.0.0"
edition = "2024"
description = "Durable session supervisor for the Tea execution core"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
tea-core = { path = "../tea-core", features = ["trace"] }
tea-luau = { path = "../tea-luau" }
tea-session = { path = "../tea-session" }
tea-protocol = { path = "../tea-protocol" }
tea-trace = { path = "../tea-trace" }

[dev-dependencies]
smol = { workspace = true }
