[package]
name = "tea-providers"
version = "1.0.0"
edition = "2024"
description = "Concrete model transports and checked-in model catalogs for Tea"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = []
provider-openrouter = [
    "dep:smol",
    "dep:tea-http",
]
# Test-only endpoint injection for the offline HTTP/1.1 OpenRouter fixture.
provider-openrouter-test-support = ["provider-openrouter"]
provider-local = [
    "dep:smol",
    "dep:tea-http",
]
provider-opencode-zen = [
    "dep:smol",
    "dep:tea-http",
]
provider-opencode-zen-test-support = ["provider-opencode-zen"]
provider-codex = [
    "dep:base64",
    "dep:getrandom",
    "dep:percent-encoding",
    "dep:rustix",
    "dep:sha2",
    "dep:smol",
    "dep:tea-http",
]
# Narrow loopback-origin injection used only by deterministic Codex provider tests.
provider-codex-test-support = ["provider-codex"]
eval-runner = ["dep:smol", "provider-openrouter"]

[dependencies]
tea-core = { path = "../tea-core" }
tea-luau = { path = "../tea-luau" }
tea-protocol = { path = "../tea-protocol" }
tea-session = { path = "../tea-session" }
smol = { workspace = true, optional = true }
tea-http = { path = "../tea-http", optional = true }
base64 = { version = "=0.22.1", optional = true }
getrandom = { version = "=0.3.4", optional = true }
percent-encoding = { version = "=2.3.2", optional = true }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"], optional = true }
sha2 = { version = "=0.10.9", optional = true }

[dev-dependencies]
smol = { workspace = true }

[[bin]]
name = "tea-eval"
path = "src/bin/tea-eval.rs"
required-features = ["eval-runner"]
