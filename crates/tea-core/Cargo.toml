[package]
name = "tea-core"
version = "1.0.0"
edition = "2024"
description = "Provider-independent Tea engine with agent, runtime, harness, coding, and evolution domains"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = []
fixture-runner = ["dep:smol"]

[dependencies]
tea-protocol = { path = "../tea-protocol" }
tea-session = { path = "../tea-session" }
tea-trace = { path = "../tea-trace" }
smol = { workspace = true, optional = true }

[dev-dependencies]
smol = { workspace = true }
# Quality-only allocation profiling. This is the same `AllocProfiler::system()`
# global-allocator pattern used by the local `e` project; it is never linked
# into the core library or production adapters.
rustybench = "=0.1.0"

[[bin]]
name = "tea-fixtures"
path = "src/bin/tea-fixtures.rs"
required-features = ["fixture-runner"]

[[bench]]
name = "quality_memory"
harness = false
