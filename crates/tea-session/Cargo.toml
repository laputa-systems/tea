[package]
name = "tea-session"
version = "1.0.0"
edition = "2024"
description = "Durable session tree, operation log, and artifact storage for Tea"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = "=1.8.6"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
tea-protocol = { path = "../tea-protocol" }
