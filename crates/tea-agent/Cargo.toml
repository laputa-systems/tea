[package]
name = "tea-agent"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "Minimal interactive terminal host for tea-core"
license = "MIT OR Apache-2.0"

[[bin]]
name = "tea"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# Compiles the real-binary PTY regression harness. The tests supply their own loopback endpoint.
pty-harness = []

[dependencies]
laputa-hi-lite = "0.1"
tea-core = { path = "../tea-core" }
tea-providers = { path = "../tea-providers", features = [
    "provider-commandcode",
    "provider-openrouter",
    "provider-local",
] }
tea-luau = { path = "../tea-luau" }
tea-protocol = { path = "../tea-protocol" }
tea-session = { path = "../tea-session" }
tea-tui = { path = "../tea-tui" }
smol = { workspace = true }
rustix = { version = "=1.1.4", default-features = false, features = ["event", "std", "termios"] }
# The CLI parser is intentionally kept small and explicit.  All command
# recognition crosses this lexopt boundary in `src/cli`.
lexopt = "=0.3.2"
# The terminal-only global configuration parser.  Keep it out of reusable crates.
toml_edit = "=0.25.13"

[dev-dependencies]
# Published package name; the library target remains `ptytest` for consumers.
laputa-ptytest = "=0.1.1"

[[test]]
name = "pty_streaming"
path = "tests/pty_streaming.rs"
required-features = ["pty-harness"]
