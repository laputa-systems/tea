[workspace]
resolver = "3"
members = [
    "crates/tea-core",
    "crates/tea-agent",
    "crates/tea-tui",
    "crates/tea-luau",
    "crates/tea-protocol",
    "crates/tea-trace",
    "crates/tea-session",
    "crates/tea-providers",
]

# Crate manifests own their dependencies. The runtime policy is executor-
# agnostic, with Smol reserved for host integration/examples/tests and Tokio
# prohibited.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Protocol and adapter JSON are intentionally lightweight and Miniserde-backed.
miniserde = "=0.1.46"
# Luau's JIT backend is compiled from source, so hosts need not install a system
# runtime. It is deliberately selected instead of mlua's mutually exclusive
# LuaJIT backends.
mlua = { version = "=0.12.0", default-features = false, features = ["luau-jit", "send"] }
smol = "=2.0.2"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
